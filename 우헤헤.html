<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빼빼로 선물 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Lobster&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ec;--bg2:#ffc2d4;--ink:#8a2846;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1220;--bg2:#4a1d36;--ink:#ffc2d4;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2a1220;--bg2:#4a1d36;--ink:#ffc2d4;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));color:var(--ink);font-family:'Nanum Pen Script',cursive,sans-serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;perspective:1400px;overflow:hidden}
#hint{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;text-align:center;font:700 18px/1.4 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}
/* ---- 3D box ---- */
#wrap{width:190px;height:340px;transform:scale(var(--k,1));transform-style:preserve-3d;cursor:grab;touch-action:none;position:relative}
#wrap:active{cursor:grabbing}
.spin{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.box{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,0,.9,.4)}
.box.away{transform:translateY(200vh) rotateZ(16deg)}
.f{position:absolute;backface-visibility:hidden;overflow:hidden}
.front{width:190px;height:340px;transform:translateZ(28px);background:linear-gradient(135deg,#fff,#f1ede8)}
.back{width:190px;height:340px;transform:rotateY(180deg) translateZ(28px);background:#f4f0ea}
.side{width:56px;height:340px;left:67px;background:linear-gradient(#b3202c 0 38%,#f4f0ea 38%)}
.right{transform:rotateY(90deg) translateZ(95px)}
.left{transform:rotateY(-90deg) translateZ(95px)}
.bottom{width:190px;height:56px;top:142px;transform:rotateX(-90deg) translateZ(170px);background:#e8e2da}
.hinge{position:absolute;left:0;top:0;width:190px;height:0;transform-style:preserve-3d;transform:translateZ(-28px);transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.open .hinge{transform:translateZ(-28px) rotateX(115deg)}
.lid{position:absolute;left:0;top:0;width:190px;height:56px;transform-origin:50% 0;transform:rotateX(90deg);background:repeating-linear-gradient(90deg,#3b1810 0 5px,#8a2f1c 5px 7px);border-bottom:3px solid #f4f0ea}
.mouth{position:absolute;left:0;top:0;width:190px;height:56px;transform-origin:50% 0;transform:translate3d(0,3px,-28px) rotateX(90deg);background:#24100a}
/* front artwork */
.fan{position:absolute;left:0;right:0;top:0;height:60%;clip-path:polygon(0 0,100% 0,100% 34%,50% 100%,0 34%);background:repeating-linear-gradient(90deg,#3b1810 0 5px,#8a2f1c 5px 7px)}
.bis{position:absolute;left:0;right:0;top:56%;height:38%;clip-path:polygon(26% 100%,74% 100%,52% 0,48% 0);background:repeating-linear-gradient(90deg,#e6b565 0 4px,#c98f3c 4px 6px)}
.glico{position:absolute;left:10px;top:8px;color:#d9a441;font:italic 700 13px Georgia,serif}
.red{position:absolute;left:50%;top:14px;width:62px;margin-left:-31px;height:112px;background:#d3202a;color:#fff;text-align:center;border-radius:3px;box-shadow:0 2px 6px #0005;font-family:'Noto Serif KR',serif}
.red b{display:block;font-size:34px;line-height:1;margin-top:8px}
.red i{display:block;font-style:normal;font-size:20px;font-weight:700;margin-top:6px;background:#fff;color:#d3202a;margin-inline:6px;border-radius:12px;padding:1px 0}
.logo{position:absolute;left:0;right:0;top:140px;text-align:center;font:400 56px/1 'Lobster',cursive;background:linear-gradient(#f9e08b,#b8862b 60%,#e8c25f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px #0005);transform:rotate(-4deg)}
.choc{position:absolute;left:0;right:0;top:206px;text-align:center;color:#4a1f12;font:700 11px sans-serif;letter-spacing:.5px}
.choc span{display:block;font-size:13px;margin-top:2px}
.seal{position:absolute;right:10px;top:244px;width:44px;height:44px;border:2px solid #d3202a;border-radius:50%;color:#d3202a;font:400 18px/40px 'Lobster',cursive;text-align:center;transform:rotate(-10deg);background:#fff9}
.to{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#ff6f9c;color:#fff;padding:2px 12px;border-radius:14px;font-size:19px;white-space:nowrap}
.bk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;color:#8a2f1c;text-align:center}
/* heart of sticks */
#sticks{position:absolute;left:50%;top:50%;width:0;height:0;z-index:5;pointer-events:none}
#sticks.ready{pointer-events:auto;cursor:pointer;animation:beat 1.3s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.05)}30%{transform:scale(1)}45%{transform:scale(1.04)}}
.stick{position:absolute;border-radius:99px;background:linear-gradient(90deg,#5a2a1a 0 64%,#e6b565 64% 100%);box-shadow:0 2px 3px #0004;transition:transform .9s cubic-bezier(.2,1.3,.4,1),opacity .4s}
.chars{position:absolute;pointer-events:inherit;transform:scale(.2);opacity:0;transition:transform .8s cubic-bezier(.2,1.5,.4,1),opacity .4s}
.chars.in{transform:none;opacity:1}
.chars svg{display:block;width:100%;height:auto;animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) rotate(2deg)}}
/* letter */
#ov{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s;z-index:20;padding:16px;box-sizing:border-box}
#ov.show{opacity:1;pointer-events:auto}
.paper{width:min(420px,100%);background:#fffaf0 repeating-linear-gradient(transparent 0 33px,#f3b8c9 33px 34px);border-radius:8px;box-shadow:0 14px 40px #0006;padding:26px 24px 20px;color:#5b2a3a;transform:translateY(80px) rotate(-2deg) scale(.9);transition:transform .8s cubic-bezier(.2,1.2,.4,1);border-top:10px solid #ff8fb0}
#ov.show .paper{transform:none}
#txt{font-size:27px;line-height:34px;white-space:pre-wrap;min-height:235px;margin:0}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.btns button{font:inherit;font-size:22px;background:#ff6f9c;color:#fff;border:0;border-radius:18px;padding:2px 16px;cursor:pointer}
.fall{position:fixed;top:-30px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<div id="stage">
  <div id="hint">상자를 돌려보고 톡 눌러봐 💗</div>
  <div id="wrap">
    <div class="spin"><div class="box" id="box">
      <div class="f mouth"></div>
      <div class="f front">
        <div class="fan"></div><div class="bis"></div>
        <div class="glico">Glico</div>
        <div class="red"><b>極細</b><i>극세</i></div>
        <div class="logo">Pocky</div>
        <div class="choc">CHOCOLATE<span>포키극세</span></div>
        <div class="seal">Real</div>
        <div class="to">To. 지오 💗</div>
      </div>
      <div class="f back"><div class="bk">🥰<br></div></div>
      <div class="f side right"></div>
      <div class="f side left"></div>
      <div class="f bottom"></div>
      <div class="hinge"><div class="f lid"></div></div>
    </div></div>
  </div>
  <div id="sticks"></div>
</div>

<div id="ov"><div class="paper">
  <p id="txt"></p>
  <div class="btns"><button id="again">처음부터</button><button id="close">닫기</button></div>
</div></div>

<script>
const LETTER = "자기야 빼빼로 데이에 못 만나서 아쉽다 !\n생각지도 못 했는데 빼빼로 챙겨줘서 고마웠어\n이번주는 못 보지만 다음주에 외박할 때\n재미있게 보내자!\n\n많이 사랑해 좋은 하루 보내 내 사랑💗\n-성희가-";
const $ = s => document.querySelector(s);
const wrap=$('#wrap'), box=$('#box'), sticks=$('#sticks'), hint=$('#hint'), ov=$('#ov'), txt=$('#txt');
let state=0, typer=null;

function fit(){
  const k=Math.min(1,(innerHeight-170)/360,(innerWidth-40)/260);
  document.documentElement.style.setProperty('--k',Math.max(.4,k));
}
fit(); addEventListener('resize',fit);

function buildHeart(){
  sticks.innerHTML='';
  const S=Math.min(innerWidth*.9,innerHeight*.62,460), sc=S/34, M=720, N=20, pts=[];
  for(let i=0;i<=M;i++){
    const t=i/M*Math.PI*2;
    pts.push([16*Math.pow(Math.sin(t),3)*sc, -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)-2)*sc]);
  }
  const cum=[0]; for(let i=1;i<=M;i++) cum[i]=cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  const total=cum[M], L=total/N*1.4, th=Math.max(9,S/34), y0=-(340/2)*parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k')||1);
  const items=[];
  for(let n=0;n<N;n++){
    let i=cum.findIndex(c=>c>=n*total/N); if(i<0) i=0;
    const a=pts[(i-3+M)%M], b=pts[(i+3)%M], p=pts[i];
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
    const d=document.createElement('div'); d.className='stick';
    d.style.cssText=`width:${L}px;height:${th}px;left:${-L/2}px;top:${-th/2}px;opacity:0;transform:translate(0,${y0}px) rotate(-90deg) scale(.3)`;
    sticks.appendChild(d); items.push([d,p,ang]);
  }
  void sticks.offsetWidth;
  items.forEach(([d,p,ang],n)=>setTimeout(()=>{
    d.style.opacity=1;
    d.style.transform=`translate(${p[0]}px,${p[1]}px) rotate(${ang}deg)`;
  },n*55));
  /* 하트 안에서 손잡은 11 캐릭터 */
  const cw=S*.42, ch=cw*170/174, c=document.createElement('div');
  c.className='chars'; c.style.cssText=`width:${cw}px;left:${-cw/2}px;top:${-ch/2}px`;
  const man=`<g stroke="#6b3a26" stroke-width="8" stroke-linejoin="miter"><path fill="#6b3a26" d="M8 12 L46 12 L46 110 L8 110Z"/></g>

    <rect x="14" y="108" width="26" height="46" rx="10" fill="#f0c987"/>
    <rect x="16" y="26" width="7" height="4" rx="2" fill="#ffb347" transform="rotate(-20 19 28)"/>
    <rect x="36" y="20" width="7" height="4" rx="2" fill="#7ed3f5" transform="rotate(30 39 22)"/>
    <rect x="30" y="40" width="7" height="4" rx="2" fill="#ff9ec4" transform="rotate(-40 33 42)"/>
    <rect x="13" y="46" width="6" height="4" rx="2" fill="#a8e063" transform="rotate(50 16 48)"/>
    <circle cx="19" cy="68" r="3.2" fill="#1d0c05"/><circle cx="35" cy="68" r="3.2" fill="#1d0c05"/>
    <path d="M20 77 Q27 85 34 77" fill="none" stroke="#1d0c05" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="13" cy="77" r="4" fill="#ff8fa8" opacity=".7"/><circle cx="41" cy="77" r="4" fill="#ff8fa8" opacity=".7"/>`;
  c.innerHTML=`<svg viewBox="-14 0 174 170" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(8,6)">${man}<path d="M6 84 L-9 62 M48 84 L69 80" fill="none" stroke="#6b3a26" stroke-width="6" stroke-linecap="round"/></g><g transform="translate(92,6)">${man}<path d="M6 84 L-15 80 M48 84 L63 62" fill="none" stroke="#6b3a26" stroke-width="6" stroke-linecap="round"/></g><circle cx="77" cy="86" r="5.5" fill="#6b3a26"/>
    <text x="66" y="30" font-size="22">💗</text></svg>`;
  sticks.appendChild(c);
  setTimeout(()=>c.classList.add('in'),N*55*.7);
  return N*55+900;
}

function rain(){
  for(let i=0;i<22;i++){
    const s=document.createElement('span'); s.className='fall'; s.textContent=['💗','💖','💕'][i%3];
    s.style.left=Math.random()*100+'vw'; s.style.fontSize=(16+Math.random()*20)+'px';
    s.style.animationDuration=(3+Math.random()*3)+'s'; s.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),7000);
  }
}

function typeLetter(){
  clearInterval(typer); txt.textContent='';
  const chars=Array.from(LETTER); let i=0;
  typer=setInterval(()=>{ txt.textContent+=chars[i++]; if(i>=chars.length) clearInterval(typer); },55);
}

function openBox(){
  if(state!==0) return; state=1;
  hint.textContent='';
  box.classList.add('open');
  setTimeout(()=>{ const wait=buildHeart(); setTimeout(()=>{ box.classList.add('away'); },500);
    setTimeout(()=>{ sticks.classList.add('ready'); hint.textContent='빼빼로 하트를 눌러봐 💗'; state=2; },wait); },650);
}

/* 마우스·터치로 상자 돌리기 (가볍게 클릭하면 열기) */
const spin=$('.spin');
let rx=-12, ry=-25, vx=0, vy=0, drag=false, moved=0, lx=0, ly=0;
function frame(){
  if(!drag){
    rx+=vx; ry+=vy; vx*=.94; vy*=.94;
    if(state===0 && Math.abs(vy)<.05) ry+=.25;
  }
  rx=Math.max(-85,Math.min(85,rx));
  spin.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;
  requestAnimationFrame(frame);
}
frame();
wrap.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;vx=vy=0;wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  ry+=dx*.6; rx-=dy*.6; vy=dx*.6; vx=-dy*.6; moved+=Math.abs(dx)+Math.abs(dy);
});
wrap.addEventListener('pointerup',()=>{drag=false; if(moved<8){vx=vy=0; openBox();}});
wrap.addEventListener('pointercancel',()=>{drag=false;});

sticks.addEventListener('click',()=>{
  if(state!==2) return; state=3;
  hint.textContent='';
  ov.classList.add('show'); typeLetter(); rain();
});

$('#close').addEventListener('click',()=>{ ov.classList.remove('show'); state=2; hint.textContent='빼빼로 하트를 눌러봐 💗'; });
$('#again').addEventListener('click',()=>{
  clearInterval(typer); ov.classList.remove('show');
  sticks.classList.remove('ready'); sticks.innerHTML='';
  box.classList.remove('open','away'); state=0; hint.textContent='상자를 돌려보고 톡 눌러봐 💗';
});
</script>
</body>
</html>
